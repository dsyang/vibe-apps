<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Photo or paste Traditional Chinese, see Mandarin pinyin" />
    <meta name="theme-color" content="#b8372b">
    <title>Pinyin Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f1e7;
            --card: #fffdf8;
            --ink: #1d1813;
            --muted: #7d7368;
            --line: #e4dccd;
            --accent: #b8372b;
            --accent-ink: #fff;
            --soft: #f1e8d8;
            --t1: #d0342c; --t2: #e08a00; --t3: #2e9a48; --t4: #2a62c9; --t5: #8a8178;
            --shadow: 0 1px 2px rgba(40,25,10,.06), 0 6px 20px rgba(40,25,10,.07);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16130f; --card: #211d18; --ink: #f1ebe1; --muted: #a39887;
                --line: #3a332a; --accent: #e0574a; --soft: #2b261f;
                --t1: #ff6b61; --t2: #ffb340; --t3: #5fd27b; --t4: #6c9cff; --t5: #a39887;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            line-height: 1.45;
            padding: max(12px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
        }
        .wrap { max-width: 640px; margin: 0 auto; }
        header { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
        header a.back { color: var(--muted); text-decoration: none; font-size: 22px; padding: 4px 6px 4px 0; }
        header h1 { font-family: 'Noto Serif TC', serif; font-size: 22px; margin: 0; flex: 1; letter-spacing: .02em; }
        header h1 span { color: var(--accent); }
        .icon-btn {
            border: 1px solid var(--line); background: var(--card); color: var(--ink);
            width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 18px;
            box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px;
        }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn {
            appearance: none; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
            padding: 10px 14px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
        }
        .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn.grow { flex: 1 1 0; justify-content: center; }
        textarea {
            width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
            background: var(--bg); color: var(--ink); padding: 12px; font: inherit; font-size: 18px; margin-top: 10px;
        }
        textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
        .status { font-size: 14px; color: var(--muted); margin-top: 10px; display: none; }
        .status.show { display: block; }
        .status.err { color: var(--accent); }
        .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
        .preview { display: none; margin-top: 10px; position: relative; }
        .preview.show { display: block; }
        .preview img { max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); display: block; }
        .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; min-height: 36px; }
        .seg button.on { background: var(--ink); color: var(--card); }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .toolbar .spacer { flex: 1; }
        .chip {
            display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: transparent;
            color: var(--ink); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; min-height: 36px;
        }
        .chip.on { background: var(--soft); border-color: var(--muted); }

        /* Reading output */
        #out { font-size: clamp(24px, 7.5vw, 34px); line-height: 1; word-break: break-all; min-height: 40px; }
        #out .line { display: flex; flex-wrap: wrap; align-items: flex-end; margin-bottom: .35em; min-height: .6em; }
        .ch {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding: .08em .06em; margin: 0 .02em .1em; border-radius: 8px; cursor: pointer; min-width: 1.05em;
            -webkit-tap-highlight-color: transparent;
        }
        .ch:active, .ch.sel { background: var(--soft); }
        .ch .py { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: .46em; line-height: 1.25; margin-bottom: .12em; white-space: nowrap; color: var(--muted); }
        .ch .hz { font-family: 'Noto Serif TC', 'Noto Sans TC', serif; font-weight: 500; line-height: 1.12; }
        .ch.poly .py { text-decoration: underline dotted; text-underline-offset: 3px; }
        .nz { font-size: .7em; padding: 0 .04em .2em; color: var(--muted); white-space: pre; align-self: flex-end; }
        .tones .t1 .py, .tones .t1 .hz { color: var(--t1); }
        .tones .t2 .py, .tones .t2 .hz { color: var(--t2); }
        .tones .t3 .py, .tones .t3 .hz { color: var(--t3); }
        .tones .t4 .py, .tones .t4 .hz { color: var(--t4); }
        .tones .t0 .py, .tones .t0 .hz { color: var(--t5); }
        .nohz .ch .hz { display: none; }
        .nohz .ch .py { font-size: .6em; color: var(--ink); }
        .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 18px 0; line-height: 1.5; }
        #translation { display: none; }
        #translation.show { display: block; }
        #translation h2, .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
        #trText { font-size: 17px; white-space: pre-wrap; }

        /* Crop screen */
        .crop {
            position: fixed; inset: 0; z-index: 30; background: #0d0b09; color: #fff; display: none;
            flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        }
        .crop.show { display: flex; }
        .crop-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; font-size: 15px; }
        .crop-top button { background: none; border: 0; color: #fff; font: inherit; font-size: 16px; padding: 8px 4px; cursor: pointer; min-height: 44px; }
        .crop-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 16px; }
        .crop-box { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; line-height: 0; }
        .crop-box img { max-width: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
        .crop-rect {
            position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.6);
            background-image: linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
            background-size: 33.33% 33.33%; background-position: -1px -1px;
        }
        .crop-rect i { position: absolute; width: 28px; height: 28px; border: 4px solid #fff; }
        .crop-rect i[data-h=nw] { left: -5px; top: -5px; border-right: 0; border-bottom: 0; }
        .crop-rect i[data-h=ne] { right: -5px; top: -5px; border-left: 0; border-bottom: 0; }
        .crop-rect i[data-h=sw] { left: -5px; bottom: -5px; border-right: 0; border-top: 0; }
        .crop-rect i[data-h=se] { right: -5px; bottom: -5px; border-left: 0; border-top: 0; }
        .crop-hint { text-align: center; font-size: 13px; color: #bbb; padding: 0 16px 8px; }        .crop-actions { display: flex; gap: 8px; padding: 8px 16px 14px; }
        .crop-actions .btn { flex: 1; justify-content: center; background: #2a2520; color: #fff; border-color: #3a332a; }
        .crop-actions .btn.primary { background: var(--accent); border-color: transparent; }
        .pop-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; transition: opacity .22s ease; }
        .pop-bg.show { display: block; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); color: var(--ink);
            border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
            transform: translateY(105%); transition: transform .22s ease, visibility .22s; max-width: 640px; margin: 0 auto;
            box-shadow: 0 -8px 30px rgba(0,0,0,.2); max-height: 85vh; overflow-y: auto; visibility: hidden;
            overscroll-behavior: contain;
        }
        .sheet.show { transform: translateY(0); visibility: visible; }
        /* Drag handle: 80x25 touch target around the visible 40x5 bar */
        .sheet .grab {
            position: relative; width: 80px; height: 25px; margin: -16px auto 2px;
            touch-action: none; cursor: grab;
        }
        .sheet .grab::before {
            content: ''; position: absolute; left: 20px; top: 10px; width: 40px; height: 5px;
            border-radius: 3px; background: var(--line);
        }
        .sheet .sub { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 0; }
        .big { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .big .hz { font-family: 'Noto Serif TC', serif; font-size: 64px; line-height: 1; }
        .big .meta { flex: 1; }
        .big .py { font-size: 26px; font-weight: 600; }
        .big .simp { color: var(--muted); font-size: 14px; }
        .readings { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
        .readings .chip { font-size: 16px; }
        label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
        input[type=text], input[type=password], select {
            width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
            padding: 11px 12px; font: inherit; font-size: 16px;
        }
        .sheet p { font-size: 14px; color: var(--muted); margin: 6px 0; }
        .sheet a { color: var(--accent); }
        .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
        .switch input { width: 22px; height: 22px; accent-color: var(--accent); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <a class="back" href="../" aria-label="Back to all tools">&larr;</a>
        <h1>拼音 <span>Pinyin Reader</span></h1>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </header>

    <div class="card">
        <div class="row">
            <label class="btn primary grow" for="file">📷 Photo</label>
            <input id="file" type="file" accept="image/*" class="hidden">
            <button class="btn grow" id="pasteBtn">📋 Paste</button>
        </div>
        <div class="preview" id="preview"><img id="previewImg" alt="Photo being read">
            <div class="row" style="margin-top:8px">
                <button class="btn grow" id="recropBtn">✂︎ Crop again</button>
                <button class="btn grow" id="rereadBtn">✨ Read with AI</button>
            </div>
        </div>
        <div class="status" id="status"><span id="statusText"></span><div class="bar"><i id="barFill"></i></div></div>
        <textarea id="input" placeholder="Paste or type Chinese…" lang="zh-Hant"></textarea>
    </div>

    <div class="card">
        <div class="toolbar">
            <div class="seg" id="toneStyle">
                <button data-v="mark" class="on">mǎ</button>
                <button data-v="num">ma3</button>
            </div>
            <button class="chip" id="toneColorBtn">🎨 Tones</button>
            <button class="chip on" id="hzBtn">字</button>
        </div>
        <div id="out"><div class="empty">Pinyin will appear here.</div></div>
        <div class="row" style="margin-top:12px">
            <button class="btn grow" id="speakBtn">🔊 Listen</button>
            <button class="btn grow" id="translateBtn">🌐 Translate</button>
        </div>
    </div>

    <div class="card" id="translation">
        <h2>Translation</h2>
        <div id="trText"></div>
    </div>
</div>

<div class="crop" id="crop" role="dialog" aria-label="Crop photo">
    <div class="crop-top">
        <button id="cropCancel">Cancel</button>
        <span>Select the words</span>
        <button id="cropReset">Reset</button>
    </div>
    <div class="crop-stage" id="cropStage">
        <div class="crop-box" id="cropBox">
            <img id="cropImg" alt="Photo to crop">
            <div class="crop-rect" id="cropRect"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
        </div>
    </div>
    <div class="crop-hint">Drag to select the text</div>
    <div class="crop-actions">
        <button class="btn" id="cropAll">Whole photo</button>
        <button class="btn primary" id="cropGo">Read selection</button>
    </div>
</div>

<div class="pop-bg" id="popBg"></div>
<div class="sheet" id="charSheet" role="dialog" aria-label="Character details">
    <div class="grab"></div>
    <div class="big">
        <div class="hz" id="cHz"></div>
        <div class="meta">
            <div class="py" id="cPy"></div>
            <div class="simp" id="cSimp"></div>
        </div>
        <button class="icon-btn" id="cSpeak" aria-label="Speak character">🔊</button>
    </div>
    <div class="hint" style="margin:0 0 6px" id="cReadHint">Other readings</div>
    <div class="readings" id="cReadings"></div>
    <div class="row">
        <a class="btn grow" id="cDict" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Dictionary ↗</a>
        <button class="btn grow" id="cClose">Done</button>
    </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Settings">
    <div class="grab"></div>
    <h2 style="font-size:18px;margin:0 0 4px">Settings</h2>
    <div class="switch"><span>Pronunciation</span>
        <div class="seg" id="region">
            <button data-v="tw" class="on">台灣 Taiwan</button>
            <button data-v="cn">大陸 Mainland</button>
        </div>
    </div>
    <div class="switch"><span>Speech voice</span>
        <select id="voiceSel" style="width:auto;max-width:60%"></select>
    </div>
    <div class="switch"><span>Read photos with</span>
        <div class="seg" id="ocrEngine">
            <button data-v="local" class="on">On device</button>
            <button data-v="llm">AI</button>
        </div>
    </div>
    <div class="sub">AI</div>
    <label class="f" for="orKey">AI key (OpenRouter)</label>
    <input type="password" id="orKey" placeholder="sk-or-…" autocomplete="off">
    <p>Only needed for AI photo reading and Translate. <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Get a key ↗</a></p>
    <label class="f" for="visionModel">Vision model (reads photos)</label>
    <input type="text" id="visionModel" list="visionList" autocapitalize="off" autocorrect="off" spellcheck="false">
    <datalist id="visionList"></datalist>
    <label class="f" for="textModel">Translation model</label>
    <input type="text" id="textModel" list="textList" autocapitalize="off" autocorrect="off" spellcheck="false">
    <datalist id="textList"></datalist>
    <div class="row" style="margin-top:14px">
        <button class="btn grow" id="resetModels">Reset models</button>
        <button class="btn primary grow" id="setClose">Done</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/t2cn.js"></script>
<script>
(() => {
    const $ = id => document.getElementById(id);
    const store = {
        get(k, d) { try { const v = localStorage.getItem('pyr.' + k); return v === null ? d : v; } catch { return d; } },
        set(k, v) { try { localStorage.setItem('pyr.' + k, v); } catch {} }
    };
    const DEFAULT_VISION = 'qwen/qwen2.5-vl-72b-instruct';
    const DEFAULT_TEXT = 'qwen/qwen-2.5-72b-instruct';
    // Open-weight model families, used to rank the live OpenRouter list.
    const OPEN_RE = /^(qwen|deepseek|meta-llama|mistralai|google\/gemma|thudm|z-ai|moonshotai|zhipu|01-ai|baidu|tencent|nousresearch|microsoft\/phi|allenai|openai\/gpt-oss|minimax)/i;

    const state = {
        tone: store.get('tone', 'mark'),
        colors: store.get('colors', '0') === '1',
        showHz: store.get('hz', '1') === '1',
        engine: store.get('engine', 'local'),
        region: store.get('region', 'tw'),
        overrides: {},          // index -> chosen reading for this text
        items: []
    };

    // ---------- Pinyin ----------
    let t2s = null;
    try { t2s = OpenCC.Converter({ from: 'tw', to: 'cn' }); } catch (e) { console.warn('OpenCC unavailable', e); }

    // ---------- Taiwan (國語) readings ----------
    // pinyin-pro follows Mainland Putonghua. Taiwan mode: (1) restores full tones on
    // syllables the Mainland reads as neutral (東西 dōngxī, 知識 zhīshì), keeping true
    // particles neutral; (2) applies Taiwan Ministry of Education readings that differ.
    const TW_CHAR = {
        期:'qí', 危:'wéi', 微:'wéi', 企:'qì', 綜:'zòng', 質:'zhí', 究:'jiù', 液:'yì', 擁:'yǒng',
        寂:'jí', 亞:'yǎ', 菌:'jùn', 癌:'yán', 播:'bò', 蝸:'guā', 帆:'fán', 惜:'xí', 昔:'xí',
        夕:'xì', 息:'xí', 擊:'jí', 績:'jī', 跡:'jī', 蹟:'jī', 誰:'shéi', 識:'shì', 熟:'shóu',
        暫:'zhàn', 髮:'fǎ', 頗:'pǒ', 偽:'wèi', 酵:'xiào', 框:'kuāng', 曝:'pù', 攜:'xī', 骰:'tóu'
    };
    const TW_WORD = {
        垃圾:['lè','sè'], 法國:['fà','guó'], 暴露:['pù','lù'], 覺得:['jué','dé'], 記得:['jì','dé'],
        值得:['zhí','dé'], 曉得:['xiǎo','dé'], 懂得:['dǒng','dé'], 認得:['rèn','dé'], 捨得:['shě','dé'],
        顯得:['xiǎn','dé'], 免得:['miǎn','dé'], 難得:['nán','dé'], 使得:['shǐ','dé'], 省得:['shěng','dé']
    };
    const TW_EXTRA = { 和:['hàn'] };
    const KEEP_NEUTRAL = new Set(Array.from('的了嗎呢吧啊呀啦喔哦哪們麼么著子地得兒嘛囉唄'));

    function applyTaiwan(li) {
        li.forEach(it => {
            if (!it.zh) return;
            if (toneOf(it.py) === 0 && !KEEP_NEUTRAL.has(it.ch)) {
                const full = it.poly.find(r => toneOf(r) !== 0);
                if (full) it.py = full;
            }
            if (TW_CHAR[it.ch]) it.py = TW_CHAR[it.ch];
        });
        for (let i = 0; i < li.length; i++) {
            for (const w in TW_WORD) {
                const wa = Array.from(w);
                if (wa.every((c, k) => li[i + k] && li[i + k].ch === c)) wa.forEach((_, k) => { li[i + k].py = TW_WORD[w][k]; });
            }
        }
    }

    // pinyin-pro's phrase data is keyed by Simplified characters, so polyphones like
    // 銀行 / 還 / 音樂 come out wrong on Traditional input. Convert per line to
    // Simplified (1:1 by character), compute readings there, and display the original.
    function analyse(text) {
        const items = [];
        const lines = text.split('\n');
        lines.forEach((line, li) => {
            const orig = Array.from(line);
            let simp = line;
            if (t2s) { const s = t2s(line); if (Array.from(s).length === orig.length) simp = s; }
            const marks = pinyinPro.pinyin(simp, { type: 'all' });
            const simpArr = Array.from(simp);
            const lineItems = orig.map((ch, i) => {
                const m = marks[i] || {};
                if (!(m.isZh && m.pinyin)) return { ch, zh: false };
                const poly = pinyinPro.pinyin(simpArr[i], { multiple: true, type: 'array' }) || [];
                return { ch, simp: simpArr[i], zh: true, py: m.pinyin, cn: m.pinyin, poly };
            });
            if (state.region === 'tw') applyTaiwan(lineItems);
            lineItems.forEach(it => {
                if (it.zh) it.poly = [...new Set([it.py, ...it.poly, it.cn, ...(TW_EXTRA[it.ch] || [])])];
                items.push(it);
            });
            if (li < lines.length - 1) items.push({ br: true });
        });
        return items;
    }

    function markToNum(py) {
        return (pinyinPro.convert ? pinyinPro.convert(py, { format: 'symbolToNum' }) : py).replace(/0$/, '');
    }
    function toneOf(py) {
        const n = markToNum(py).match(/(\d)$/);
        return n ? +n[1] % 5 : 0;
    }

    function shown(item, idx) {
        const py = state.overrides[idx] || item.py;

    // ---------- Drag-to-dismiss sheets ----------
    // One gesture handler for every .sheet. A drag down (from anywhere on the sheet, while
    // it is scrolled to the top) follows the finger and fades the backdrop. Release past
    // DIST px or with a fast downward flick to dismiss; otherwise snap back. Taps on
    // inputs/controls are untouched until the drag passes SLOP px.
    function dismissable(sheet) {
        const SKIP = /^(INPUT|SELECT|TEXTAREA)$/;
        const SLOP = 8, DIST = 80, FLICK = 0.5;   // px, px, px/ms
        const bg = $('popBg');
        let g = null;   // { id, y0, x0, start, y, t, v, d, active }
        const setDragging = on => {
            sheet.style.transition = on ? 'none' : '';
            bg.style.transition = on ? 'none' : '';
        };
        sheet.addEventListener('pointerdown', e => {
            if (SKIP.test(e.target.tagName)) return;
            g = { id: e.pointerId, y0: e.clientY, x0: e.clientX, start: 0, y: e.clientY, t: e.timeStamp, v: 0, d: 0, active: false };
        });
        sheet.addEventListener('pointermove', e => {
            if (!g || e.pointerId !== g.id) return;
            if (!g.active) {
                const dy = e.clientY - g.y0;
                if (dy < 0) { g = null; return; }
                if (dy < SLOP) return;
                // Only a near-vertical pull from the top of a sheet becomes a dismiss drag.
                if (sheet.scrollTop > 0 || Math.abs(e.clientX - g.x0) > dy) { g = null; return; }
                g.active = true;
                g.start = e.clientY; g.y = e.clientY; g.t = e.timeStamp;
                try { sheet.setPointerCapture(e.pointerId); } catch {}

            g.d = Math.max(0, e.clientY - g.start);
            if (e.timeStamp > g.t) g.v = (e.clientY - g.y) / (e.timeStamp - g.t);
            g.y = e.clientY; g.t = e.timeStamp;

            const was = g; g = null;
            if (!was.active) return;
            const quick = e.timeStamp - was.t < 100 && was.v > FLICK;   // pause before lift = not a flick
            setDragging(false);                       // restore CSS transitions
            if (was.d > DIST || quick) showSheet(null);

            // dragged position (to 105% when dismissed, or back to 0 when it snaps back).
            sheet.style.transform = '';
            bg.style.opacity = '';

        sheet.addEventListener('pointerup', release);
        sheet.addEventListener('pointercancel', release);
    }

    };

    // Split at sentence punctuation / newlines into chunks of at most 60 characters.
    function chunks(text) {
        const out = [];
        let cur = '';
        for (let p of text.match(/[^。！？；，,.!?;\n]+[。！？；，,.!?;\n]*|[。！？；，,.!?;\n]+/g) || []) {
            while (p.length > 60) { if (cur) { out.push(cur); cur = ''; } out.push(p.slice(0, 60)); p = p.slice(60); }
            if ((cur + p).length > 60) { out.push(cur); cur = ''; }

        if (cur) out.push(cur);

                session++; speechSynthesis.cancel(); finish();

        });

    }

    // ---------- Crop ----------
    // rect is kept as fractions of the image (0..1) so it survives layout changes.
    let cropSrc = null, cropUrl = null, rect = null;
    const MIN = 0.04;
    function openCrop(blob) {
        if (busy) return;

    function sizeCropImg() {

        const k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);

        img.style.height = Math.floor(img.naturalHeight * k) + 'px';
    }

    function drawRect() {

    }

                if (drag.fresh && Math.abs(p.x - drag.ax) < .01 && Math.abs(p.y - drag.ay) < .01) return;

    // ---------- On-device OCR: PP-OCRv5 (PaddleOCR) via ONNX Runtime Web ----------
    // Detection (DB) finds text lines; each line is cropped (vertical columns rotated
    // 90° CCW, as PaddleOCR does) and recognised with a CTC model covering
    // Simplified + Traditional Chinese. Models come from npm via jsDelivr and are
    // kept in the Cache API after the first download.
    const ORT_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
    const MODEL_BASE = 'https://cdn.jsdelivr.net/npm/pdfmarkdown-ppocrv5-models@1.0.0/';
    const MODEL_FILES = {
        det: 'detection/PP-OCRv5_mobile_det_infer.ort',
        rec: 'recognition/PP-OCRv5_mobile_rec_infer.onnx',
        dict: 'recognition/ppocrv5_dict.txt'

    async function fetchCached(url, onBytes) {
        let cache = null;
        try { cache = await caches.open('pinyin-reader-models-v1'); const hit = await cache.match(url); if (hit) return new Uint8Array(await hit.arrayBuffer()); } catch {}
        const r = await fetch(url);
        if (!r.ok) throw new Error('download failed (' + r.status + ')');
        const total = +r.headers.get('content-length') || 0;
        const chunks = []; let got = 0;
        const reader = r.body.getReader();
        for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onBytes && onBytes(got, total); }
        const buf = new Uint8Array(got); let o = 0; for (const c of chunks) { buf.set(c, o); o += c.length; }
        try { if (cache) await cache.put(url, new Response(buf.slice())); } catch {}
        return buf;
    }

    function loadPaddle() {
        return paddleLoading ||= (async () => {
            setStatus('Loading on-device reader…', false, 0);
            if (!window.ort) await loadScript(ORT_BASE + 'ort.wasm.min.js');
            ort.env.wasm.wasmPaths = ORT_BASE;
            ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
            const prog = {}, EST = { det: 4.9e6, rec: 16.6e6, dict: 7.4e4 };
            const report = () => {
                const got = Object.values(prog).reduce((a, b) => a + b, 0);
                setStatus('Downloading Chinese text model (first time only, ~22 MB)…', false, got / (EST.det + EST.rec + EST.dict));
            };
            const [det, rec, dict] = await Promise.all(['det', 'rec', 'dict'].map(k =>
                fetchCached(MODEL_BASE + MODEL_FILES[k], g => { prog[k] = g; report(); })));
            setStatus('Starting on-device reader…', false, 1);
            const opts = { executionProviders: ['wasm'], graphOptimizationLevel: 'all' };
            // This dict file already holds the CTC blank slot (line 0) and the trailing
            // space, so line k is class k (18385 classes).
            const lines = new TextDecoder().decode(dict).replace(/\r/g, '').split('\n');
            if (lines.length > 18385 && lines[lines.length - 1] === '') lines.pop();
            paddle = {
                det: await ort.InferenceSession.create(det, opts),
                rec: await ort.InferenceSession.create(rec, opts),
                chars: lines
            };
            return paddle;
        })().catch(e => { paddleLoading = null; throw e; });

    function toTensor(data, w, h, mean, std) {
        // RGBA -> planar BGR float32, normalised like PaddleOCR (cv2 images are BGR)
        const n = w * h, out = new Float32Array(3 * n);
        for (let i = 0; i < n; i++) {
            const r = data[i * 4] / 255, g = data[i * 4 + 1] / 255, b = data[i * 4 + 2] / 255;
            out[i] = (b - mean[0]) / std[0];
            out[n + i] = (g - mean[1]) / std[1];
            out[2 * n + i] = (r - mean[2]) / std[2];
        }
        return out;
    }

    async function detectBoxes(src) {
        const W = src.width, H = src.height, LIMIT = 1280;
        const r = Math.min(1, LIMIT / Math.max(W, H));
        const rw = Math.max(32, Math.round(W * r / 32) * 32), rh = Math.max(32, Math.round(H * r / 32) * 32);
        const c = document.createElement('canvas'); c.width = rw; c.height = rh;
        const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, rw, rh);
        const input = toTensor(g.getImageData(0, 0, rw, rh).data, rw, rh, [0.485, 0.456, 0.406], [0.229, 0.224, 0.225]);
        const res = await paddle.det.run({ [paddle.det.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, rh, rw]) });
        const prob = res[paddle.det.outputNames[0]].data;

        // Connected components on the thresholded probability map; each component's
        // orientation comes from its second moments so tilted lines get straightened.
        const n = rw * rh, label = new Uint8Array(n), pix = new Int32Array(n), boxes = [];
        const sx = W / rw, sy = H / rh, T = 0.3;
        for (let i = 0; i < n; i++) {
            if (label[i] || prob[i] <= T) continue;
            let head = 0, tail = 0, sum = 0, mx = 0, my = 0;
            pix[tail++] = i; label[i] = 1;
            while (head < tail) {
                const p = pix[head++], x = p % rw, y = (p - x) / rw;
                sum += prob[p]; mx += x; my += y;
                if (x > 0 && !label[p - 1] && prob[p - 1] > T) { label[p - 1] = 1; pix[tail++] = p - 1; }
                if (x < rw - 1 && !label[p + 1] && prob[p + 1] > T) { label[p + 1] = 1; pix[tail++] = p + 1; }
                if (y > 0 && !label[p - rw] && prob[p - rw] > T) { label[p - rw] = 1; pix[tail++] = p - rw; }
                if (y < rh - 1 && !label[p + rw] && prob[p + rw] > T) { label[p + rw] = 1; pix[tail++] = p + rw; }
            }
            const cnt = tail;
            if (cnt < 10 || sum / cnt < 0.5) continue;
            mx /= cnt; my /= cnt;
            // work in original-image pixels from here on
            let cxx = 0, cyy = 0, cxy = 0;
            for (let k = 0; k < cnt; k++) {
                const p = pix[k], x = ((p % rw) - mx) * sx, y = (((p - p % rw) / rw) - my) * sy;
                cxx += x * x; cyy += y * y; cxy += x * y;
            }
            let phi = 0.5 * Math.atan2(2 * cxy, cxx - cyy);          // major-axis angle
            const extents = ang => {
                const c = Math.cos(ang), si = Math.sin(ang);
                let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
                for (let k = 0; k < cnt; k++) {
                    const p = pix[k], x = ((p % rw) - mx) * sx, y = (((p - p % rw) / rw) - my) * sy;
                    const u = x * c + y * si, v = -x * si + y * c;
                    if (u < u0) u0 = u; if (u > u1) u1 = u; if (v < v0) v0 = v; if (v > v1) v1 = v;
                }
                return { L: u1 - u0 + Math.max(sx, sy), Th: v1 - v0 + Math.max(sx, sy), cu: (u0 + u1) / 2, cv: (v0 + v1) / 2 };
            };
            let e = extents(phi);
            if (e.L < 1.5 * e.Th) { phi = 0; e = extents(0); }          // short blob: keep upright
            if (Math.min(e.L, e.Th) < 3 * Math.max(sx, sy)) continue;
            const vertical = Math.abs(Math.sin(phi)) > Math.SQRT1_2;
            if (vertical && Math.sin(phi) < 0) phi += Math.PI;         // columns run downward
            if (!vertical && Math.cos(phi) < 0) phi += Math.PI;        // rows run rightward
            e = extents(phi);
            const d = (e.L * e.Th * 1.5) / (2 * (e.L + e.Th));          // DB "unclip" expansion
            const L = e.L + 2 * d, Th = e.Th + 2 * d;
            const c = Math.cos(phi), si = Math.sin(phi);
            const cx = mx * sx + e.cu * c - e.cv * si, cy = my * sy + e.cu * si + e.cv * c;
            const hw = Math.abs(L * c) / 2 + Math.abs(Th * si) / 2, hh = Math.abs(L * si) / 2 + Math.abs(Th * c) / 2;
            boxes.push({ cx, cy, L, Th, phi, vertical, x: cx - hw, y: cy - hh, w: 2 * hw, h: 2 * hh });
        }
        return boxes;
    }

    async function recognise(src, b) {
        const H = 48;
        const tw = Math.max(8, Math.min(3200, Math.ceil(H * b.L / b.Th)));
        const W = Math.max(320, tw);
        const c = document.createElement('canvas'); c.width = tw; c.height = H;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.fillStyle = '#fff'; g.fillRect(0, 0, tw, H);
        // Map the rotated rect onto the crop: text direction -> +x. Vertical columns
        // therefore end up rotated 90° CCW, which is what PP-OCR's recogniser expects.
        g.translate(tw / 2, H / 2); g.scale(tw / b.L, H / b.Th); g.rotate(-b.phi); g.translate(-b.cx, -b.cy);
        g.drawImage(src, 0, 0);
        const part = toTensor(g.getImageData(0, 0, tw, H).data, tw, H, [0.5, 0.5, 0.5], [0.5, 0.5, 0.5]);
        const input = new Float32Array(3 * H * W);   // zero padding on the right, as PaddleOCR does
        for (let ch = 0; ch < 3; ch++) for (let y = 0; y < H; y++)
            input.set(part.subarray(ch * H * tw + y * tw, ch * H * tw + (y + 1) * tw), ch * H * W + y * W);
        const res = await paddle.rec.run({ [paddle.rec.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, H, W]) });
        const out = res[paddle.rec.outputNames[0]], [, T, C] = out.dims, d = out.data;
        let text = '', prev = 0, conf = 0, nc = 0;
        for (let t = 0; t < T; t++) {
            let best = 0, bv = -Infinity;
            for (let k = 0; k < C; k++) { const v = d[t * C + k]; if (v > bv) { bv = v; best = k; } }
            if (best && best !== prev) { text += paddle.chars[best] || ''; conf += bv; nc++; }
            prev = best;
        }
        return { text, conf: nc ? conf / nc : 0 };
    }

    async function ocrPaddle(blob) {
        await loadPaddle();
        const src = await loadCanvas(blob, 2400);
        setStatus('Finding text…', false, 0);
        const boxes = await detectBoxes(src);
        const found = [];
        for (let i = 0; i < boxes.length; i++) {
            setStatus('Reading characters…', false, i / boxes.length);
            const r = await recognise(src, boxes[i]);
            if (r.text.trim() && r.conf >= 0.5) found.push({ ...boxes[i], ...r });
        }
        return orderLines(found);
    }

    // Reading order: vertical columns right-to-left; otherwise rows top-to-bottom.
    function orderLines(items) {
        if (!items.length) return '';
        const vert = items.filter(i => i.vertical).length > items.length / 2;
        if (vert) {
            return items.sort((a, b) => (b.x + b.w) - (a.x + a.w) || a.y - b.y).map(i => i.text).join('\n');
        }
        items.sort((a, b) => a.y - b.y);
        const rows = [];
        for (const it of items) {
            const cy = it.y + it.h / 2;
            const row = rows.find(r => Math.abs(r.cy - cy) < Math.min(r.h, it.h) * 0.5);
            if (row) row.items.push(it); else rows.push({ cy, h: it.h, items: [it] });
        }
        return rows.map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.text).join(' ')).join('\n');
    }

    function tidy(t) {
        const cjk = '\\u2E80-\\u9FFF\\uF900-\\uFAFF\\uFF00-\\uFFEF\\u3000-\\u303F';
        return (t || '')
            .replace(new RegExp('([' + cjk + '])[ \\t]+(?=[' + cjk + '])', 'g'), '$1')
            .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    let tess = null, tessLang = null, tessLoading = null;
    function loadScript(src) {
        return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + src)); document.head.appendChild(s); });
    }
    async function ocrTesseract(blob) {
        const lang = 'chi_tra';
        setStatus('Loading on-device reader…', false, 0);
        if (!window.Tesseract) await (tessLoading ||= loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'));
        if (!tess || tessLang !== lang) {
            if (tess) { await tess.terminate(); tess = null; }
            tess = await Tesseract.createWorker(lang, 1, {
                logger: m => {
                    if (m.status === 'recognizing text') setStatus('Reading characters…', false, m.progress);
                    else if (/loading|initializ/i.test(m.status)) setStatus('Preparing Chinese model (first time downloads ~10 MB)…', false, m.progress || 0);
                }
            });
            tessLang = lang;
            await tess.setParameters({ tessedit_pageseg_mode: '3', preserve_interword_spaces: '0' });
        }
        const canvas = await loadCanvas(blob, 2200);
        setStatus('Reading characters…', false, 0);
        const { data } = await tess.recognize(canvas);
        return data.text;
    }

    // ---------- OpenRouter ----------
    const keyEl = $('orKey'), vEl = $('visionModel'), tEl = $('textModel');
    keyEl.value = store.get('key', '');
    vEl.value = store.get('vmodel', DEFAULT_VISION);
    tEl.value = store.get('tmodel', DEFAULT_TEXT);
    keyEl.oninput = () => store.set('key', keyEl.value.trim());
    vEl.oninput = () => store.set('vmodel', vEl.value.trim());
    tEl.oninput = () => store.set('tmodel', tEl.value.trim());
    $('resetModels').onclick = () => { vEl.value = DEFAULT_VISION; tEl.value = DEFAULT_TEXT; store.set('vmodel', DEFAULT_VISION); store.set('tmodel', DEFAULT_TEXT); };
    $('settingsBtn').onclick = () => { showSheet('setSheet'); loadModelList(); };
    $('setClose').onclick = () => showSheet(null);

    let modelsLoaded = false;
    async function loadModelList() {
        if (modelsLoaded) return; modelsLoaded = true;
        try {
            const r = await fetch('https://openrouter.ai/api/v1/models');
            const { data } = await r.json();
            const price = m => (+m.pricing?.prompt || 0) + (+m.pricing?.completion || 0);
            const usable = data.filter(m => (m.architecture?.output_modalities || ['text']).includes('text') && OPEN_RE.test(m.id))
                .sort((a, b) => price(a) - price(b));
            const fill = (el, list) => {
                el.innerHTML = '';
                list.slice(0, 80).forEach(m => {
                    const o = document.createElement('option'); o.value = m.id;
                    const p = price(m) * 1e6 / 2;
                    o.label = (m.name || m.id) + (p ? ' · ~$' + p.toFixed(2) + '/M tok' : ' · free');
                    el.appendChild(o);
                });
            };
            fill($('visionList'), usable.filter(m => (m.architecture?.input_modalities || []).includes('image')));
            fill($('textList'), usable);
        } catch (e) { modelsLoaded = false; }
    }

    async function openrouter(model, messages) {
        const key = keyEl.value.trim();
        if (!key) { showSheet('setSheet'); throw new Error('add an OpenRouter API key in Settings'); }
        const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'X-Title': 'Pinyin Reader' },
            body: JSON.stringify({ model, messages, temperature: 0 })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.error) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status) + (r.status === 404 || r.status === 400 ? ' — check the model name in Settings' : ''));
        return (j.choices?.[0]?.message?.content || '').trim();
    }

    async function ocrLLM(blob) {
        setStatus('Reading with AI…');
        const c = await loadCanvas(blob, 1600);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        const txt = await openrouter(vEl.value.trim() || DEFAULT_VISION, [{
            role: 'user', content: [
                { type: 'text', text: 'Transcribe all Chinese text in this image exactly as written, using Traditional Chinese characters. Keep the original line breaks. If the text is vertical, read columns top-to-bottom, right-to-left, one column per line. Output only the transcribed text — no pinyin, translation, quotes, or commentary.' },
                { type: 'image_url', image_url: { url: dataUrl } }
            ]
        }]);
        return txt.replace(/^```\w*\n?|```$/g, '');
    }

    $('translateBtn').onclick = async () => {
        const text = $('input').value.trim(); if (!text) return;
        const btn = $('translateBtn'); btn.disabled = true; const o = btn.textContent; btn.textContent = 'Translating…';
        try {
            const model = tEl.value.trim() || DEFAULT_TEXT;
            const out = await openrouter(model, [
                { role: 'system', content: 'You translate Traditional Chinese into natural, faithful English. Output only the translation.' },
                { role: 'user', content: text }
            ]);
            $('trText').textContent = out;
            $('translation').classList.add('show');
            $('translation').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (e) { setStatus('Translate failed: ' + e.message, true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        finally { btn.disabled = false; btn.textContent = o; }
    };

    // ---------- Init ----------
    const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
    $('input').value = fromHash || store.get('text', '');
    update(true);
})();
</script>
