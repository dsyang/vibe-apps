<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Hold to slow time, drag to steer. Roguelike snake.">
<title>Bullet-Time Snake v1</title>
<style>
  :root { --bg:#0d0f14; --fg:#e8ecf3; --dim:#7b8496; --accent:#53f2a6; --warn:#ff5a6e; --card:#151923; --line:#2a3142; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  canvas { touch-action:none; display:block; }
  button { font-family:inherit; }

  /* HUD */
  #hud { position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:12px; right:12px; height:36px; pointer-events:none;
    display:flex; align-items:center; justify-content:space-between; z-index:5; font-variant-numeric:tabular-nums; }
  #score { font-size:22px; font-weight:700; letter-spacing:.5px; line-height:1.1; }
  #stats { font-size:12px; color:var(--dim); white-space:nowrap; }
  #hudR { display:flex; gap:8px; pointer-events:auto; }
  #hudR button { width:36px; height:36px; border-radius:10px; border:1px solid #232836; background:var(--card); color:var(--fg);
    font-size:17px; display:grid; place-items:center; padding:0; }
  #tags { position:fixed; top:calc(env(safe-area-inset-top) + 50px); left:12px; right:12px; height:22px; z-index:5; pointer-events:none;
    display:flex; align-items:center; justify-content:space-between; font-size:12px; }
  #chip { padding:2px 9px; border-radius:11px; background:#1a1f2b; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  #chip.on { color:#fff; border-color:var(--warn); background:#2a1820; }
  #chip.soon { color:#ffd2d8; border-color:#6b3340; }
  #owned { font-size:16px; letter-spacing:2px; }

  /* tutorial tip */
  #tip { position:fixed; left:16px; right:16px; top:calc(env(safe-area-inset-top) + 76px); z-index:4; pointer-events:none; text-align:center; }
  #skip { pointer-events:auto; position:absolute; top:-2px; right:0; background:none; border:0; color:var(--dim); font-size:12px; padding:8px 4px; }
  #tip .main { position:relative; display:inline-block; background:rgba(20,24,34,.88); border:1px solid var(--line); border-radius:12px;
    padding:28px 14px 10px; font-size:15px; line-height:1.35; max-width:340px; }
  #tip .sub { margin-top:6px; font-size:13px; color:var(--accent); min-height:18px; transition:opacity .3s; }
  #tip .sub.bad { color:var(--warn); }
  #tip .step { font-size:11px; letter-spacing:1.5px; color:var(--dim); margin-bottom:4px; }

  /* banner (stage / resume countdown) */
  #banner { position:fixed; inset:0; z-index:3; display:grid; place-items:center; pointer-events:none; font-size:34px; font-weight:800;
    letter-spacing:3px; text-shadow:0 2px 12px rgba(0,0,0,.7); }

  /* screens */
  #overlay { position:fixed; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); pointer-events:none; overflow-y:auto; }
  #overlay.modal { pointer-events:auto; background:rgba(13,15,20,.92); }
  #overlay.start { pointer-events:none; background:rgba(13,15,20,.82); justify-content:flex-end; }
  #overlay h1 { margin:0 0 8px; font-size:30px; letter-spacing:1px; }
  #overlay h2 { margin:0 0 6px; font-size:13px; letter-spacing:2px; color:var(--dim); font-weight:600; }
  #overlay p { margin:4px 0; color:var(--dim); font-size:15px; line-height:1.4; max-width:340px; }
  #overlay p b { color:var(--fg); }
  #overlay .big { color:var(--fg); font-size:17px; margin-top:16px; }
  #overlay .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #overlay .btns { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; pointer-events:auto; margin-top:18px; }
  #overlay .btns button { width:100%; height:56px; border-radius:16px; font-size:18px; font-weight:700; letter-spacing:.3px; }
  .primary { background:var(--accent); color:#06110b; border:0; }
  .secondary { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .cards { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .card { width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:16px; border-radius:16px;
    background:var(--card); border:1px solid var(--line); color:var(--fg); }
  .card:active { border-color:var(--accent); }
  .card .ic { font-size:34px; width:44px; text-align:center; }
  .card b { display:block; font-size:18px; margin-bottom:2px; }
  .card span { font-size:14px; color:var(--dim); line-height:1.3; }
  .card.challenge { flex-direction:column; text-align:center; border-color:#6b3340; background:#1d1318; }
  .card.challenge .ic { font-size:52px; width:auto; }
  .have { margin-top:14px; font-size:13px; color:var(--dim); }
  .box { width:100%; max-width:360px; margin:10px 0 0; padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    text-align:left; font-size:14px; line-height:1.6; color:var(--dim); }
  .box b { color:var(--fg); font-weight:600; }
  .box.mods { border-color:#6b5a1f; color:#e6c76a; font-size:13px; line-height:1.5; }
  .seed { font-family:ui-monospace,Menlo,monospace; letter-spacing:3px; color:var(--accent); font-size:17px; }
  .hidden { display:none !important; }

  /* debug sheet */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:10; background:#141822; border-top:1px solid #262c3b;
    border-radius:18px 18px 0 0; padding:16px 18px calc(env(safe-area-inset-bottom) + 18px); transform:translateY(105%);
    transition:transform .25s ease; max-height:85vh; overflow-y:auto; user-select:text; -webkit-user-select:text; }
  #sheet.open { transform:none; }
  #sheet h2 { margin:0 0 10px; font-size:16px; display:flex; justify-content:space-between; align-items:center; }
  #sheet h2 button { background:none; border:0; color:var(--accent); font-size:15px; font-weight:600; }
  .row { margin:12px 0; }
  .grp { margin:18px 0 4px; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); }
  .grp.sub { color:var(--dim); margin-top:12px; }
  .row label { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-bottom:6px; }
  .row label b { color:var(--fg); font-weight:600; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .inp { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#1a1f2b; color:var(--fg); font-size:14px; }
  select.inp { appearance:none; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { flex:1; min-width:30%; padding:8px; border-radius:8px; border:1px solid var(--line); background:#1a1f2b; color:var(--dim); font-size:13px; }
  .seg button.on { color:#06110b; background:var(--accent); border-color:var(--accent); font-weight:600; }
  .reset { width:100%; margin-top:20px; padding:12px; border-radius:10px; border:1px solid #6b3340; background:#1d1318; color:#ff9aa8; font-size:14px; }
</style>
</head>
<body>
<div id="hud">
  <div><div id="score">0</div><div id="stats"></div></div>
  <div id="hudR">
    <button id="pausebtn" aria-label="Pause">⏸</button>
    <button id="help" aria-label="Tutorial">?</button>
    <button id="gear" aria-label="Debug settings">⚙︎</button>
  </div>
</div>
<div id="tags"><div id="chip" class="hidden"></div><div id="owned"></div></div>
<div id="tip" class="hidden"><div class="main"><div class="step"></div><button id="skip">Skip tutorial ›</button><div class="txt"></div><div class="sub"></div></div></div>
<div id="banner" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="sheet"></div>

<script src="bts-v1/littlejs.release.js"></script>
<script src="bts-v1/rng.js"></script>
<script src="bts-v1/content.js"></script>
<script src="bts-v1/game.js"></script>
<script src="bts-v1/ui.js"></script>
</body>
</html>
