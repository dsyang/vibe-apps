<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="A simple 2048 clone">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: #faf8ef;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
                 max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
        touch-action: none;
    }

    /* Layout is driven by --board (the square play area), computed from BOTH viewport
       width and height so it fits phones, the foldable's near-square inner screen and
       its short cover screen, in either orientation. Tiles/gaps/fonts scale from it. */
    :root {
        --pad: clamp(8px, 2.5vmin, 20px);
        /* horizontal/vertical space actually usable once safe-area insets (notch, hinge, status overlay) are applied */
        --avail-w: calc(100vw - max(var(--pad), env(safe-area-inset-left)) - max(var(--pad), env(safe-area-inset-right)));
        --avail-h: calc(100vh - max(var(--pad), env(safe-area-inset-top)) - max(var(--pad), env(safe-area-inset-bottom)));
        /* stacked (portrait): leave room for header, button, controls */
        --board: max(200px, min(var(--avail-w), 100vh - 340px, 520px));
        --board: max(200px, min(var(--avail-w), 100dvh - 340px, 520px));
        --gap: calc(var(--board) * 0.03);
        --cell: calc((var(--board) - 5 * var(--gap)) / 4);
    }

    .container {
        width: 100%;
        min-width: 0;
        margin: 0 auto;
        display: grid;
        justify-content: center;
        gap: 12px 24px;
        grid-template-columns: var(--board);
        grid-template-areas:
            "header"
            "controls"
            "board"
            "instr"
            "vctl";
    }
    .header { grid-area: header; }
    .controls { grid-area: controls; }
    .game-container { grid-area: board; }
    .instructions { grid-area: instr; }
    .virtual-controls { grid-area: vctl; }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    h1 {
        font-size: clamp(32px, calc(var(--board) * 0.095), 48px);
        color: #776e65;
        font-weight: bold;
    }

    .score-container {
        background: #bbada0;
        padding: 10px 20px;
        border-radius: 3px;
        color: white;
        text-align: center;
        min-width: 80px;
    }

    .score-label {
        font-size: 13px;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .score {
        font-size: 24px;
        font-weight: bold;
    }

    .controls {
        display: flex;
        gap: 10px;
    }

    button {
        background: #8f7a66;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 3px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.1s;
    }

    button:hover {
        background: #9f8a76;
    }

    button:active {
        background: #7f6a56;
    }

    .game-container {
        background: #bbada0;
        border-radius: 6px;
        padding: var(--gap);
        position: relative;
        width: var(--board);
        height: var(--board);
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, var(--cell));
        grid-auto-rows: var(--cell);
        gap: var(--gap);
        position: relative;
    }

    .cell {
        background: rgba(238, 228, 218, 0.35);
        border-radius: 3px;
        width: var(--cell);
        height: var(--cell);
    }

    .tile-container {
        position: absolute;
        top: var(--gap);
        left: var(--gap);
        right: var(--gap);
        bottom: var(--gap);
    }

    .tile {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--board) * 0.09);
        font-weight: bold;
        border-radius: 3px;
        transition: all 0.15s ease-in-out;
    }

    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: calc(var(--board) * 0.075); }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: calc(var(--board) * 0.075); }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: calc(var(--board) * 0.075); }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: calc(var(--board) * 0.062); }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: calc(var(--board) * 0.062); }
    .tile-super { background: #3c3a32; color: #f9f6f2; font-size: calc(var(--board) * 0.05); }

    .tile-new {
        animation: appear 0.2s;
    }

    @keyframes appear {
        from {
            transform: scale(0);
        }
        to {
            transform: scale(1);
        }
    }

    .game-over-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(238, 228, 218, 0.73);
        border-radius: 6px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }

    .game-over-overlay.active {
        display: flex;
    }

    .game-over-message {
        font-size: calc(var(--board) * 0.095);
        font-weight: bold;
        color: #776e65;
        margin-bottom: 20px;
        text-align: center;
    }

    .instructions {
        color: #776e65;
        font-size: 14px;
        text-align: center;
        line-height: 1.6;
    }

    .virtual-controls {
        display: flex;
        gap: 10px;
        width: 100%;
        margin: 0 auto;
        justify-content: center;
    }

    .virtual-controls button {
        flex: 1;
        max-width: 80px;
        font-size: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 8px;
        min-height: 60px;
        gap: 2px;
    }

    .virtual-controls button .key {
        font-size: 12px;
        opacity: 0.7;
    }

    @media (max-width: 400px) {
        .virtual-controls button {
            max-width: none;
            padding: 10px 5px;
            font-size: 18px;
        }

        .virtual-controls button .key {
            font-size: 10px;
        }
    }

    /* short viewports (cover screen, landscape phones): drop the prose to save height */
    @media (max-height: 700px) {
        .instructions { display: none; }
        :root {
            --board: max(200px, min(var(--avail-w), 100vh - 270px, 520px));
            --board: max(200px, min(var(--avail-w), 100dvh - 270px, 520px));
        }
    }

    /* wide viewports (landscape, or a wide inner screen): board on the left, panel on the right */
    @media (min-aspect-ratio: 5/4) {
        :root {
            --board: max(200px, min(var(--avail-h), var(--avail-w) - 300px, 640px));
            --board: max(200px, min(var(--avail-h), var(--avail-w) - 300px, 640px));
        }
        .container {
            grid-template-columns: var(--board) minmax(200px, 280px);
            grid-template-rows: auto auto auto auto 1fr;
            align-content: center;
            grid-template-areas:
                "board header"
                "board controls"
                "board instr"
                "board vctl"
                "board .";
            align-items: start;
        }
        .game-container { align-self: center; grid-row: 1 / -1; }
        .virtual-controls button { min-height: 52px; }
    }
    @media (min-aspect-ratio: 5/4) and (max-height: 520px) {
        .instructions { display: none; }
        .virtual-controls button { min-height: 44px; padding: 6px 4px; }
    }
</style>

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-label">Score</div>
                <div class="score" id="score">0</div>
            </div>
        </div>

    <div class="controls">
        <button id="newGame">New Game</button>
    </div>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- 4x4 grid cells -->
        </div>
        <div class="tile-container" id="tileContainer"></div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-message">Game Over!</div>
            <button id="retryButton">Try Again</button>
        </div>
    </div>

    <div class="instructions">
        <strong>How to play:</strong> Use arrow keys, swipe, or buttons below to move tiles. Tiles with the same number merge into one when they touch. Add them up to reach 2048!
    </div>

    <div class="virtual-controls">
        <button id="btnLeft" aria-label="Move left">
            <div>◀</div>
            <div class="key">h</div>
        </button>
        <button id="btnDown" aria-label="Move down">
            <div>▼</div>
            <div class="key">j</div>
        </button>
        <button id="btnUp" aria-label="Move up">
            <div>▲</div>
            <div class="key">k</div>
        </button>
        <button id="btnRight" aria-label="Move right">
            <div>▶</div>
            <div class="key">l</div>
        </button>
    </div>
</div>

<script>
    class Game2048 {
        constructor() {
            this.gridSize = 4;
            this.grid = [];
            this.score = 0;
            this.gameOver = false;
            this.storageKey = 'game2048-state';

            this.gridElement = document.getElementById('grid');
            this.tileContainer = document.getElementById('tileContainer');
            this.scoreElement = document.getElementById('score');
            this.gameOverOverlay = document.getElementById('gameOverOverlay');

            this.setupGrid();
            this.setupEventListeners();

            // re-place tiles when the board resizes (rotation, fold/unfold, split view)
            new ResizeObserver(() => this.render(false)).observe(this.gridElement);

            // Load saved game or start new game
            if (!this.loadGame()) {
                this.newGame();
            }
        }

        setupGrid() {
            // Create grid cells
            for (let i = 0; i < this.gridSize * this.gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                this.gridElement.appendChild(cell);
            }
        }

        setupEventListeners() {
            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (this.gameOver) return;
                
                const key = e.key.toLowerCase();
                const keyMap = {
                    'arrowup': 'ArrowUp',
                    'arrowdown': 'ArrowDown',
                    'arrowleft': 'ArrowLeft',
                    'arrowright': 'ArrowRight',
                    'k': 'ArrowUp',
                    'j': 'ArrowDown',
                    'h': 'ArrowLeft',
                    'l': 'ArrowRight'
                };
                
                if (keyMap[key]) {
                    e.preventDefault();
                    this.move(keyMap[key]);
                }
            });

            // Touch controls on game area
            let touchStartX = 0;
            let touchStartY = 0;

            const gameContainer = document.querySelector('.game-container');
            
            gameContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            gameContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            gameContainer.addEventListener('touchend', (e) => {
                if (this.gameOver) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                const minSwipeDistance = 30;

                if (Math.abs(deltaX) < minSwipeDistance && Math.abs(deltaY) < minSwipeDistance) {
                    return;
                }

                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // Horizontal swipe
                    if (deltaX > 0) {
                        this.move('ArrowRight');
                    } else {
                        this.move('ArrowLeft');
                    }
                } else {
                    // Vertical swipe
                    if (deltaY > 0) {
                        this.move('ArrowDown');
                    } else {
                        this.move('ArrowUp');
                    }
                }
            }, { passive: true });

            // Virtual button controls
            document.getElementById('btnUp').addEventListener('click', () => {
                if (!this.gameOver) this.move('ArrowUp');
            });
            document.getElementById('btnDown').addEventListener('click', () => {
                if (!this.gameOver) this.move('ArrowDown');
            });
            document.getElementById('btnLeft').addEventListener('click', () => {
                if (!this.gameOver) this.move('ArrowLeft');
            });
            document.getElementById('btnRight').addEventListener('click', () => {
                if (!this.gameOver) this.move('ArrowRight');
            });

            // New game button
            document.getElementById('newGame').addEventListener('click', () => this.newGame());
            document.getElementById('retryButton').addEventListener('click', () => this.newGame());
        }

        handleSwipe(startX, startY, endX, endY) {
            const deltaX = endX - startX;
            const deltaY = endY - startY;
            const minSwipeDistance = 30;

            if (Math.abs(deltaX) < minSwipeDistance && Math.abs(deltaY) < minSwipeDistance) {
                return;
            }

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX > 0) {
                    this.move('ArrowRight');
                } else {
                    this.move('ArrowLeft');
                }
            } else {
                // Vertical swipe
                if (deltaY > 0) {
                    this.move('ArrowDown');
                } else {
                    this.move('ArrowUp');
                }
            }
        }

        newGame() {
            this.grid = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(0));
            this.score = 0;
            this.gameOver = false;
            this.scoreElement.textContent = '0';
            this.gameOverOverlay.classList.remove('active');

            // Clear saved game from localStorage
            localStorage.removeItem(this.storageKey);

            // Add two initial tiles
            this.addRandomTile();
            this.addRandomTile();
            this.render();
            this.saveGame();
        }

        saveGame() {
            const gameState = {
                grid: this.grid,
                score: this.score,
                gameOver: this.gameOver
            };
            localStorage.setItem(this.storageKey, JSON.stringify(gameState));
        }

        loadGame() {
            const savedState = localStorage.getItem(this.storageKey);
            if (savedState) {
                try {
                    const gameState = JSON.parse(savedState);
                    this.grid = gameState.grid;
                    this.score = gameState.score;
                    this.gameOver = gameState.gameOver;
                    this.scoreElement.textContent = this.score;
                    if (this.gameOver) {
                        this.gameOverOverlay.classList.add('active');
                    }
                    this.render();
                    return true;
                } catch (e) {
                    console.error('Failed to load saved game:', e);
                    return false;
                }
            }
            return false;
        }

        addRandomTile() {
            const emptyCells = [];
            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    if (this.grid[row][col] === 0) {
                        emptyCells.push({ row, col });
                    }
                }
            }

            if (emptyCells.length > 0) {
                const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                this.grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                return true;
            }
            return false;
        }

        move(direction) {
            let moved = false;
            const oldGrid = JSON.parse(JSON.stringify(this.grid));

            switch (direction) {
                case 'ArrowUp':
                    moved = this.moveUp();
                    break;
                case 'ArrowDown':
                    moved = this.moveDown();
                    break;
                case 'ArrowLeft':
                    moved = this.moveLeft();
                    break;
                case 'ArrowRight':
                    moved = this.moveRight();
                    break;
            }

            if (moved) {
                this.addRandomTile();
                this.render();

                if (!this.canMove()) {
                    this.gameOver = true;
                    this.gameOverOverlay.classList.add('active');
                }

                // Save game state after each move
                this.saveGame();
            }
        }

        moveLeft() {
            let moved = false;
            for (let row = 0; row < this.gridSize; row++) {
                const line = this.grid[row].filter(cell => cell !== 0);
                const merged = [];
                
                for (let i = 0; i < line.length; i++) {
                    if (i < line.length - 1 && line[i] === line[i + 1]) {
                        merged.push(line[i] * 2);
                        this.score += line[i] * 2;
                        i++;
                    } else {
                        merged.push(line[i]);
                    }
                }
                
                while (merged.length < this.gridSize) {
                    merged.push(0);
                }
                
                if (JSON.stringify(this.grid[row]) !== JSON.stringify(merged)) {
                    moved = true;
                }
                this.grid[row] = merged;
            }
            return moved;
        }

        moveRight() {
            let moved = false;
            for (let row = 0; row < this.gridSize; row++) {
                const line = this.grid[row].filter(cell => cell !== 0);
                const merged = [];
                
                for (let i = line.length - 1; i >= 0; i--) {
                    if (i > 0 && line[i] === line[i - 1]) {
                        merged.unshift(line[i] * 2);
                        this.score += line[i] * 2;
                        i--;
                    } else {
                        merged.unshift(line[i]);
                    }
                }
                
                while (merged.length < this.gridSize) {
                    merged.unshift(0);
                }
                
                if (JSON.stringify(this.grid[row]) !== JSON.stringify(merged)) {
                    moved = true;
                }
                this.grid[row] = merged;
            }
            return moved;
        }

        moveUp() {
            let moved = false;
            for (let col = 0; col < this.gridSize; col++) {
                const line = [];
                for (let row = 0; row < this.gridSize; row++) {
                    if (this.grid[row][col] !== 0) {
                        line.push(this.grid[row][col]);
                    }
                }
                
                const merged = [];
                for (let i = 0; i < line.length; i++) {
                    if (i < line.length - 1 && line[i] === line[i + 1]) {
                        merged.push(line[i] * 2);
                        this.score += line[i] * 2;
                        i++;
                    } else {
                        merged.push(line[i]);
                    }
                }
                
                while (merged.length < this.gridSize) {
                    merged.push(0);
                }
                
                for (let row = 0; row < this.gridSize; row++) {
                    if (this.grid[row][col] !== merged[row]) {
                        moved = true;
                    }
                    this.grid[row][col] = merged[row];
                }
            }
            return moved;
        }

        moveDown() {
            let moved = false;
            for (let col = 0; col < this.gridSize; col++) {
                const line = [];
                for (let row = 0; row < this.gridSize; row++) {
                    if (this.grid[row][col] !== 0) {
                        line.push(this.grid[row][col]);
                    }
                }
                
                const merged = [];
                for (let i = line.length - 1; i >= 0; i--) {
                    if (i > 0 && line[i] === line[i - 1]) {
                        merged.unshift(line[i] * 2);
                        this.score += line[i] * 2;
                        i--;
                    } else {
                        merged.unshift(line[i]);
                    }
                }
                
                while (merged.length < this.gridSize) {
                    merged.unshift(0);
                }
                
                for (let row = 0; row < this.gridSize; row++) {
                    if (this.grid[row][col] !== merged[row]) {
                        moved = true;
                    }
                    this.grid[row][col] = merged[row];
                }
            }
            return moved;
        }

        canMove() {
            // Check if there are any empty cells
            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    if (this.grid[row][col] === 0) return true;
                }
            }

            // Check if any adjacent cells can be merged
            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    const current = this.grid[row][col];
                    if (col < this.gridSize - 1 && current === this.grid[row][col + 1]) return true;
                    if (row < this.gridSize - 1 && current === this.grid[row + 1][col]) return true;
                }
            }

            return false;
        }

        render(animate = true) {
            this.tileContainer.innerHTML = '';
            this.scoreElement.textContent = this.score;

            // measure the live layout (board size changes with screen/orientation/fold state)
            const cellSize = this.gridElement.querySelector('.cell').getBoundingClientRect().width;
            const gap = parseFloat(getComputedStyle(this.gridElement).columnGap) || 0;

            for (let row = 0; row < this.gridSize; row++) {
                for (let col = 0; col < this.gridSize; col++) {
                    const value = this.grid[row][col];
                    if (value !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${value > 2048 ? 'super' : value}${animate ? ' tile-new' : ''}`;
                        tile.textContent = value;
                        
                        const left = col * (cellSize + gap);
                        const top = row * (cellSize + gap);
                        
                        tile.style.left = `${left}px`;
                        tile.style.top = `${top}px`;
                        tile.style.width = `${cellSize}px`;
                        tile.style.height = `${cellSize}px`;
                        
                        this.tileContainer.appendChild(tile);
                        
                        if (animate) setTimeout(() => tile.classList.remove('tile-new'), 200);
                    }
                }
            }
        }
    }

    // Initialize game when page loads
    window.addEventListener('DOMContentLoaded', () => {
        new Game2048();
    });

    // Prevent accidental navigation (especially from swipe gestures on mobile)
    window.addEventListener('beforeunload', (e) => {
        e.preventDefault();
        e.returnValue = ''; // Chrome requires returnValue to be set
    });
</script>

</body>
</html>
