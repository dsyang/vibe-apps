<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Universal currency converter for USD, EUR, TWD (NTD), and JPY." />
  <title>Currency Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-alt: #222632;
      --border: #2e3345;
      --text: #e8eaf0;
      --text-dim: #7a8199;
      --usd: #4ade80;
      --eur: #facc15;
      --ntd: #f472b6;
      --jpy: #60a5fa;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-date {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .rates-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 30px;
    }

    .rate-chip {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .rate-chip .val { color: var(--text); font-weight: 500; }

    .rate-source {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      font-family: 'DM Mono', monospace;
      opacity: 0.6;
    }

    .rate-source.live { color: var(--usd); opacity: 1; }

    /* Converter */
    .converter {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .currency-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s, opacity 0.25s, transform 0.25s;
    }

    .currency-row.active {
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--active-glow);
      background: var(--surface-alt);
    }

    .currency-row[data-currency="USD"] { --accent: var(--usd); --active-glow: rgba(74,222,128,0.1); }
    .currency-row[data-currency="EUR"] { --accent: var(--eur); --active-glow: rgba(250,204,21,0.1); }
    .currency-row[data-currency="NTD"] { --accent: var(--ntd); --active-glow: rgba(244,114,182,0.1); }
    .currency-row[data-currency="JPY"] { --accent: var(--jpy); --active-glow: rgba(96,165,250,0.1); }

    .activate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      min-height: 56px;
      border: none;
      border-radius: 10px;
      background: var(--surface-alt);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .activate-btn::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      transition: all 0.25s;
    }

    .currency-row.active .activate-btn { background: var(--accent); }
    .currency-row.active .activate-btn::after {
      border-color: var(--bg);
      background: var(--bg);
      box-shadow: 0 0 0 3px var(--accent);
    }

    .input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 4px;
      min-width: 0;
    }

    .currency-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .currency-row.active .currency-label { color: var(--accent); }

    .currency-select {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-dim);
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      margin-bottom: 2px;
      padding: 0;
      max-width: 100%;
    }

    .currency-row.active .currency-select { color: var(--accent); }
    .currency-select option { background: var(--surface-alt); color: var(--text); }
    .currency-select option:disabled { color: var(--text-dim); }

    .currency-input {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      background: none;
      border: none;
      color: var(--text);
      outline: none;
      width: 100%;
      padding: 2px 0;
    }

    .currency-input::placeholder { color: var(--text-dim); opacity: 0.4; }
    .currency-input:not(:focus) { color: var(--text-dim); }
    .currency-row.active .currency-input { color: var(--text) !important; }

    .flag-area {
      display: flex;
      align-items: center;
      padding-right: 12px;
      font-size: 26px;
      flex-shrink: 0;
    }

    /* Flag is tappable on swappable rows to open the currency picker */
    .currency-row:not([data-currency="USD"]) .flag-area {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Long-press feedback on removable row */
    .currency-row.row-pressing {
      opacity: 0.45;
      transform: scale(0.97);
      transition: opacity 0.08s, transform 0.08s !important;
    }

    /* Add currency button */
    .add-currency-btn {
      display: block;
      width: 100%;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      background: none;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      margin-top: 12px;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .add-currency-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .add-currency-btn.hidden { display: none; }

    /* History */
    .history-section h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .clear-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover { border-color: var(--text-dim); color: var(--text); }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      line-height: 1.5;
      animation: slideIn 0.2s ease;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .history-item:active { background: var(--surface-alt); border-color: var(--text-dim); }
    .history-item .from { color: var(--text); font-weight: 500; }
    .history-item .arrow { color: var(--text-dim); margin: 0 4px; }
    .history-meta { font-size: 11px; opacity: 0.45; margin-top: 4px; }

    .history-empty {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0.4;
      text-align: center;
      padding: 20px;
    }

    .math-hint {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 24px;
      opacity: 0.5;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media screen and (max-width: 768px) {
      .currency-input { font-size: 22px; }
    }

    @supports (-webkit-touch-callout: none) {
      input { font-size: 22px !important; }
    }

    /* Numeric keyboard */

    .numpad {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 480px;
      z-index: 100;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 10px 12px max(20px, env(safe-area-inset-bottom));
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
    }

    .numpad.visible { transform: translateX(-50%) translateY(0); }

    .numpad-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 10px;
    }

    .numpad-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .numpad-active-label {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .numpad-active-label .numpad-currency-flag { margin-right: 4px; }
    .numpad-active-label .numpad-currency-code { color: var(--text); }

    .numpad-header-btns { display: flex; gap: 8px; }

    .numpad-abc-btn, .numpad-done-header-btn {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .numpad-abc-btn:active, .numpad-done-header-btn:active {
      background: var(--border);
    }

    .numpad-done-header-btn {
      color: var(--text);
      border-color: var(--text-dim);
    }

    .numpad-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .numpad-key {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      height: 58px;
      border-radius: 12px;
      border: none;
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .numpad-key:active { background: var(--border); transform: scale(0.92); }

    .numpad-key.key-op {
      font-size: 22px;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.08);
    }

    .numpad-key.key-op:active { background: rgba(167, 139, 250, 0.18); }

    .numpad-key.key-clear {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
    }

    .numpad-key.key-clear:active { background: rgba(248, 113, 113, 0.18); }

    .numpad-key.key-back {
      font-size: 22px;
      color: var(--text-dim);
    }

    .numpad-key.key-done {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--text);
      color: var(--bg);
    }

    .numpad-key.key-done:active { background: var(--text-dim); transform: scale(0.92); }

    .numpad-key.key-double { font-size: 16px; }

    .app.numpad-open { padding-bottom: 290px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-date" id="todayDate"></div>
      <h1>💱 Currency Converter</h1>
      <div class="rates-bar" id="ratesBar"></div>
      <div class="rate-source" id="rateSource">Loading rates…</div>
    </div>

    <div class="converter" id="converter"></div>

    <button class="add-currency-btn hidden" id="addCurrencyBtn">+ Add currency</button>

    <div class="math-hint" id="mathHint">
      tip: type expressions like 1500+200 or 50*3 ·
      <button id="switchToNumpadBtn" style="font-family:inherit;font-size:inherit;background:none;border:none;color:var(--text-dim);cursor:pointer;text-decoration:underline;padding:0;opacity:0.7">use numpad</button>
    </div>

    <div class="history-section">
      <h2>
        History
        <button class="clear-btn" id="clearHistory">clear</button>
      </h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">No conversions yet</div>
      </div>
    </div>
  </div>

  <!-- Numeric keyboard -->
  <div class="numpad" id="numpad" role="dialog" aria-label="Numeric keyboard">
    <div class="numpad-handle"></div>
    <div class="numpad-header">
      <div class="numpad-active-label">
        <span class="numpad-currency-flag" id="numpadFlag"></span><span class="numpad-currency-code" id="numpadCode"></span>
      </div>
      <div class="numpad-header-btns">
        <button class="numpad-abc-btn" id="numpadAbcBtn">ABC</button>
        <button class="numpad-done-header-btn" id="numpadDoneBtn">Done</button>
      </div>
    </div>
    <div class="numpad-keys" id="numpadKeys">
      <button class="numpad-key key-clear" data-key="clear">CLR</button>
      <button class="numpad-key" data-key="7">7</button>
      <button class="numpad-key" data-key="8">8</button>
      <button class="numpad-key" data-key="9">9</button>

      <button class="numpad-key key-back" data-key="back">⌫</button>
      <button class="numpad-key" data-key="4">4</button>
      <button class="numpad-key" data-key="5">5</button>
      <button class="numpad-key" data-key="6">6</button>

      <button class="numpad-key key-op" data-key="+">+</button>
      <button class="numpad-key" data-key="1">1</button>
      <button class="numpad-key" data-key="2">2</button>
      <button class="numpad-key" data-key="3">3</button>

      <button class="numpad-key key-double" data-key="00">00</button>
      <button class="numpad-key" data-key=".">.</button>
      <button class="numpad-key" data-key="0">0</button>
      <button class="numpad-key key-done" data-key="done">✓</button>
    </div>
  </div>

  <script>
    const CURRENCIES = [
      { code: 'USD', label: 'USD',       symbol: '$',   flag: '🇺🇸', decimals: 2, chipDecimals: 2 },
      { code: 'EUR', label: 'EUR',       symbol: '€',   flag: '🇪🇺', decimals: 2, chipDecimals: 4 },
      { code: 'GBP', label: 'GBP',       symbol: '£',   flag: '🇬🇧', decimals: 2, chipDecimals: 4 },
      { code: 'NTD', label: 'TWD (NTD)', symbol: 'NT$', flag: '🇹🇼', decimals: 2, chipDecimals: 2 },
      { code: 'JPY', label: 'JPY',       symbol: '¥',   flag: '🇯🇵', decimals: 0, chipDecimals: 0 },
      { code: 'CNY', label: 'CNY (RMB)', symbol: 'CN¥', flag: '🇨🇳', decimals: 2, chipDecimals: 2 },
      { code: 'CAD', label: 'CAD',       symbol: 'C$',  flag: '🇨🇦', decimals: 2, chipDecimals: 2 },
    ];
    const CURRENCY_MAP = Object.fromEntries(CURRENCIES.map(c => [c.code, c]));
    const FALLBACK_RATES = { USD: 1, EUR: 0.92, GBP: 0.79, NTD: 32.5, JPY: 150.0, CNY: 7.2, CAD: 1.37 };

    // --- Numpad state ---
    let numpadMode = (() => {
      const s = localStorage.getItem('fx_numpad_mode');
      return s === null ? true : s === 'true';
    })();
    let numpadVisible = false;

    const numpadEl = document.getElementById('numpad');
    const numpadFlagEl = document.getElementById('numpadFlag');
    const numpadCodeEl = document.getElementById('numpadCode');
    const appEl = document.querySelector('.app');
    const mathHintEl = document.getElementById('mathHint');

    function showNumpad() {
      numpadVisible = true;
      numpadEl.classList.add('visible');
      appEl.classList.add('numpad-open');
      updateNumpadHeader();
      setAllInputsNumpadMode(true);
    }

    function hideNumpad() {
      numpadVisible = false;
      numpadEl.classList.remove('visible');
      appEl.classList.remove('numpad-open');
      setAllInputsNumpadMode(false);
    }

    function setAllInputsNumpadMode(on) {
      converterEl.querySelectorAll('.currency-input').forEach(inp => {
        if (on) {
          inp.setAttribute('inputmode', 'none');
          inp.readOnly = true;
        } else {
          inp.setAttribute('inputmode', 'text');
          const isActive = inp.dataset.currency === activeCurrency;
          inp.readOnly = !isActive;
        }
      });
    }

    function updateNumpadHeader() {
      const cfg = CURRENCY_MAP[activeCurrency];
      if (!cfg) return;
      numpadFlagEl.textContent = cfg.flag + ' ';
      numpadCodeEl.textContent = cfg.label;
    }

    function handleNumpadKey(key) {
      const inp = converterEl.querySelector(`.currency-input[data-currency="${activeCurrency}"]`);
      if (!inp) return;

      let val = inp.value;

      if (key === 'clear') {
        val = '';
      } else if (key === 'back') {
        val = val.slice(0, -1);
      } else if (key === 'done') {
        logConversion();
        hideNumpad();
        return;
      } else if (key === '.') {
        const parts = val.split(/[+\-*/]/);
        const last = parts[parts.length - 1];
        if (last.includes('.')) return;
        val = val + '.';
      } else if (key === '00') {
        if (!val || val === '0') return;
        val = val + '00';
      } else if (key === '+') {
        if (!val || /[+\-*/]$/.test(val)) return;
        val = val + '+';
      } else {
        if (val === '0') val = key;
        else val = val + key;
      }

      inp.value = val;
      inp.dispatchEvent(new Event('input'));
    }

    function initNumpad() {
      document.getElementById('numpadKeys').addEventListener('click', e => {
        const btn = e.target.closest('[data-key]');
        if (btn) handleNumpadKey(btn.dataset.key);
      });

      document.getElementById('numpadDoneBtn').addEventListener('click', () => {
        logConversion();
        hideNumpad();
      });

      document.getElementById('numpadAbcBtn').addEventListener('click', () => {
        numpadMode = false;
        localStorage.setItem('fx_numpad_mode', 'false');
        hideNumpad();
        mathHintEl.style.display = '';
        const inp = converterEl.querySelector(`.currency-input[data-currency="${activeCurrency}"]`);
        if (inp) {
          inp.readOnly = false;
          inp.setAttribute('inputmode', 'text');
          inp.focus();
        }
      });

      document.addEventListener('pointerdown', e => {
        if (!numpadVisible) return;
        if (e.target.closest('#numpad, #converter, #addCurrencyBtn')) return;
        logConversion();
        hideNumpad();
      }, { capture: true });
    }

    // --- State ---
    let slots = (() => {
      try {
        const s = JSON.parse(localStorage.getItem('fx_universal_slots') || '["USD","EUR"]');
        if (Array.isArray(s) && s.length >= 2 && s[0] === 'USD' && s.every(c => CURRENCY_MAP[c])) return s;
      } catch {}
      return ['USD', 'EUR'];
    })();

    let rates = { ...FALLBACK_RATES };
    let activeCurrency = 'USD';
    let history = (() => {
      try { return JSON.parse(localStorage.getItem('fx_universal_history') || '[]'); } catch { return []; }
    })();
    let liveRates = false;
    let debounceTimer = null;

    // --- DOM ---
    const converterEl = document.getElementById('converter');
    const addBtn = document.getElementById('addCurrencyBtn');
    const ratesBar = document.getElementById('ratesBar');
    const rateSourceEl = document.getElementById('rateSource');
    const historyList = document.getElementById('historyList');

    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // --- Rate chips (reactive to slots) ---
    function renderRateChips() {
      const usdCfg = CURRENCY_MAP['USD'];
      const nonUSD = slots.filter(c => c !== 'USD');
      ratesBar.innerHTML = nonUSD.map(code => {
        const cfg = CURRENCY_MAP[code];
        const val = rates[code];

        // For currencies stronger than the dollar (where $1 buys less than 1
        // unit), invert the rate so it reads "1 EUR = $1.09 USD" instead of
        // the harder-to-grok "$1 USD = 0.92 EUR".
        if (val < 1) {
          const inverted = 1 / val;
          const formatted = usdCfg.chipDecimals === 0
            ? Math.round(inverted).toLocaleString('en-US')
            : inverted.toFixed(usdCfg.chipDecimals);
          return `<span class="rate-chip">1 ${cfg.label} = <span class="val">${usdCfg.symbol}${formatted}</span> USD</span>`;
        }

        const formatted = cfg.chipDecimals === 0
          ? Math.round(val).toLocaleString('en-US')
          : val.toFixed(cfg.chipDecimals);
        return `<span class="rate-chip">$1 USD = <span class="val">${formatted}</span> ${cfg.label}</span>`;
      }).join('');
    }

    // --- Fetch live rates ---
    async function fetchRates() {
      const apis = [
        {
          url: 'https://open.er-api.com/v6/latest/USD',
          parse: d => ({ USD: 1, EUR: d.rates.EUR, GBP: d.rates.GBP, NTD: d.rates.TWD, JPY: d.rates.JPY, CNY: d.rates.CNY, CAD: d.rates.CAD })
        },
        {
          url: 'https://api.exchangerate-api.com/v4/latest/USD',
          parse: d => ({ USD: 1, EUR: d.rates.EUR, GBP: d.rates.GBP, NTD: d.rates.TWD, JPY: d.rates.JPY, CNY: d.rates.CNY, CAD: d.rates.CAD })
        }
      ];

      for (const api of apis) {
        try {
          const res = await fetch(api.url);
          if (!res.ok) continue;
          const data = await res.json();
          const parsed = api.parse(data);
          if (parsed.EUR && parsed.GBP && parsed.NTD && parsed.JPY && parsed.CNY && parsed.CAD) {
            rates = parsed;
            liveRates = true;
            renderRateChips();
            updateRateSource();
            return;
          }
        } catch { continue; }
      }
      updateRateSource();
    }

    function updateRateSource() {
      if (liveRates) {
        rateSourceEl.textContent = '● Live rates';
        rateSourceEl.classList.add('live');
      } else {
        rateSourceEl.textContent = 'Using fallback rates (offline)';
      }
    }

    // --- Render converter ---
    function renderConverter() {
      const savedCurrency = slots.includes(activeCurrency) ? activeCurrency : 'USD';
      const savedEl = converterEl.querySelector(`.currency-input[data-currency="${savedCurrency}"]`);
      const savedValue = savedEl ? savedEl.value : '';

      converterEl.innerHTML = '';
      converterEl.appendChild(buildUSDRow());
      slots.slice(1).forEach((code, i) => {
        const slotIdx = i + 1;
        const canRemove = slots.length === 3 && slotIdx === slots.length - 1;
        converterEl.appendChild(buildSwappableRow(code, slotIdx, canRemove));
      });

      addBtn.classList.toggle('hidden', slots.length >= 3);
      wireRows();

      activeCurrency = savedCurrency;
      applyActiveClass(savedCurrency);

      if (savedValue) {
        const inp = converterEl.querySelector(`.currency-input[data-currency="${savedCurrency}"]`);
        if (inp) {
          inp.value = savedValue;
          inp.dispatchEvent(new Event('input'));
        }
      }
    }

    function buildUSDRow() {
      const cfg = CURRENCY_MAP['USD'];
      const row = document.createElement('div');
      row.className = 'currency-row active';
      row.dataset.currency = 'USD';
      row.innerHTML = `
        <button class="activate-btn" aria-label="Activate USD input"></button>
        <div class="input-area">
          <div class="currency-label">${cfg.label}</div>
          <input class="currency-input" type="text" inputmode="text" placeholder="0" data-currency="USD" />
        </div>
        <div class="flag-area">${cfg.flag}</div>
      `;
      return row;
    }

    function buildSwappableRow(code, slotIdx, canRemove) {
      const cfg = CURRENCY_MAP[code];
      const row = document.createElement('div');
      row.className = 'currency-row';
      row.dataset.currency = code;

      const options = CURRENCIES.filter(c => c.code !== 'USD').map(c => {
        const inUse = slots.includes(c.code) && c.code !== code;
        return `<option value="${c.code}"${c.code === code ? ' selected' : ''}${inUse ? ' disabled' : ''}>${c.label} ${c.flag}</option>`;
      }).join('');

      if (canRemove) row.dataset.removable = 'true';

      row.innerHTML = `
        <button class="activate-btn" aria-label="Activate ${cfg.label} input"></button>
        <div class="input-area">
          <select class="currency-select" data-slot="${slotIdx}">${options}</select>
          <input class="currency-input" type="text" inputmode="text" placeholder="0" data-currency="${code}" />
        </div>
        <div class="flag-area">${cfg.flag}</div>
      `;
      return row;
    }

    function wireRows() {
      converterEl.querySelectorAll('.currency-row').forEach(row => {
        const currency = row.dataset.currency;
        const activateBtn = row.querySelector('.activate-btn');
        const input = row.querySelector('.currency-input');
        const sel = row.querySelector('.currency-select');

        activateBtn.addEventListener('click', () => activate(currency));
        input.addEventListener('click', () => { if (numpadMode) activate(currency); });
        input.addEventListener('focus', () => { if (!numpadMode) setActive(currency); });

        input.addEventListener('input', () => {
          if (currency !== activeCurrency) return;
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            const val = evalExpr(input.value);
            const otherInputs = converterEl.querySelectorAll('.currency-input');
            if (isNaN(val) || val === 0) {
              otherInputs.forEach(inp => { if (inp.dataset.currency !== activeCurrency) inp.value = ''; });
              return;
            }
            const converted = convert(currency, val);
            otherInputs.forEach(inp => {
              const c = inp.dataset.currency;
              if (c !== activeCurrency && converted[c] !== undefined) {
                inp.value = formatValue(converted[c], c);
              }
            });
          }, 150);
        });

        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.target.blur(); logConversion(); }
        });

        input.addEventListener('blur', () => {
          if (currency === activeCurrency && input.value.trim()) logConversion();
        });

        if (sel) {
          sel.addEventListener('focus', () => setActive(currency, false));
          sel.addEventListener('change', () => {
            onSlotChange(parseInt(sel.dataset.slot), sel.value);
          });

          // Tapping the flag opens the currency picker
          const flagArea = row.querySelector('.flag-area');
          if (flagArea) {
            flagArea.addEventListener('click', () => {
              if (numpadVisible) hideNumpad();
              setActive(currency, false);
              try { sel.showPicker(); } catch { sel.click(); }
            });
          }
        }

        // Long-press on the removable (3rd) row to remove it
        if (row.dataset.removable) {
          let pressTimer = null;
          let pressOrigin = null;

          row.addEventListener('pointerdown', (e) => {
            pressOrigin = { x: e.clientX, y: e.clientY };
            row.classList.add('row-pressing');
            pressTimer = setTimeout(() => {
              row.classList.remove('row-pressing');
              removeSlot();
            }, 600);
          });

          const cancelPress = () => {
            clearTimeout(pressTimer);
            row.classList.remove('row-pressing');
            pressOrigin = null;
          };

          row.addEventListener('pointerup', cancelPress);
          row.addEventListener('pointercancel', cancelPress);
          row.addEventListener('pointermove', (e) => {
            if (!pressOrigin) return;
            const d = Math.hypot(e.clientX - pressOrigin.x, e.clientY - pressOrigin.y);
            if (d > 8) cancelPress();
          });
          row.addEventListener('contextmenu', e => e.preventDefault());
        }
      });
    }

    // --- Activation ---
    function setActive(currency, triggerKeyboard = true) {
      activeCurrency = currency;
      applyActiveClass(currency);
      if (numpadMode && triggerKeyboard) {
        showNumpad();
      }
    }

    function activate(currency) {
      setActive(currency);
      if (!numpadMode) {
        const inp = converterEl.querySelector(`.currency-input[data-currency="${currency}"]`);
        if (inp) inp.focus();
      }
    }

    function applyActiveClass(currency) {
      converterEl.querySelectorAll('.currency-row').forEach(r => {
        const isActive = r.dataset.currency === currency;
        r.classList.toggle('active', isActive);
        const inp = r.querySelector('.currency-input');
        if (inp) {
          if (numpadVisible) {
            inp.readOnly = true;
            inp.setAttribute('inputmode', 'none');
          } else {
            inp.readOnly = !isActive;
          }
        }
      });
      if (numpadVisible) updateNumpadHeader();
    }

    // --- Slot management ---
    function onSlotChange(slotIdx, newCode) {
      slots[slotIdx] = newCode;
      saveSlots();
      if (!slots.includes(activeCurrency)) activeCurrency = 'USD';
      renderConverter();
      renderRateChips();
    }

    function addSlot() {
      if (slots.length >= 3) return;
      const next = CURRENCIES.find(c => c.code !== 'USD' && !slots.includes(c.code));
      if (!next) return;
      slots.push(next.code);
      saveSlots();
      renderConverter();
      renderRateChips();
    }

    function removeSlot() {
      if (slots.length <= 2) return;
      const removed = slots.pop();
      if (activeCurrency === removed) activeCurrency = 'USD';
      saveSlots();
      renderConverter();
      renderRateChips();
    }

    function saveSlots() {
      localStorage.setItem('fx_universal_slots', JSON.stringify(slots));
    }

    // --- Math expression evaluator ---
    function evalExpr(str) {
      const cleaned = str.replace(/[^0-9+\-*/().,%\s]/g, '');
      if (!cleaned.trim()) return NaN;
      const withPercent = cleaned.replace(/(\d+(?:\.\d+)?)\s*%/g, '($1/100)');
      const noCommas = withPercent.replace(/,/g, '');
      try {
        const result = Function('"use strict"; return (' + noCommas + ')')();
        return typeof result === 'number' && isFinite(result) ? result : NaN;
      } catch { return NaN; }
    }

    // --- Conversion ---
    function convert(fromCode, value) {
      const inUSD = value / rates[fromCode];
      const result = {};
      for (const code of slots) {
        if (code !== fromCode) result[code] = inUSD * rates[code];
      }
      return result;
    }

    function formatValue(val, code) {
      const cfg = CURRENCY_MAP[code];
      if (cfg.decimals === 0) return Math.round(val).toLocaleString('en-US');
      return val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // --- History ---
    function logConversion() {
      const inp = converterEl.querySelector(`.currency-input[data-currency="${activeCurrency}"]`);
      if (!inp) return;
      const raw = inp.value;
      const val = evalExpr(raw);
      if (isNaN(val) || val === 0) return;

      const cfg = CURRENCY_MAP[activeCurrency];
      const converted = convert(activeCurrency, val);
      const others = Object.entries(converted)
        .map(([c, v]) => `${CURRENCY_MAP[c].symbol}${formatValue(v, c)} ${c}`)
        .join(' · ');

      const entry = {
        from: `${cfg.symbol}${formatValue(val, activeCurrency)} ${activeCurrency}`,
        to: others,
        expr: raw !== formatValue(val, activeCurrency) ? raw : null,
        time: Date.now(),
        sourceCurrency: activeCurrency,
        sourceValue: raw,
        slots: [...slots],
        rates: { ...rates },
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      if (history.length > 0 && history[0].from === entry.from && history[0].to === entry.to) return;

      history.unshift(entry);
      if (history.length > 30) history.pop();
      localStorage.setItem('fx_universal_history', JSON.stringify(history));
      renderHistory();
    }

    function chipFormatRate(code, val) {
      const cfg = CURRENCY_MAP[code];
      if (!cfg || val == null) return '—';
      if (cfg.chipDecimals === 0) return Math.round(val).toLocaleString('en-US');
      return val.toFixed(cfg.chipDecimals);
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No conversions yet</div>';
        return;
      }

      historyList.innerHTML = history.map((h, i) => {
        const exprNote = h.expr ? `<span style="opacity:0.4"> (${h.expr})</span>` : '';
        let rateMeta = '';
        if (h.rates && h.slots) {
          const parts = h.slots
            .filter(c => c !== 'USD')
            .map(c => {
              const cfg = CURRENCY_MAP[c];
              if (!cfg || h.rates[c] == null) return null;
              return `${cfg.symbol}${chipFormatRate(c, h.rates[c])}`;
            })
            .filter(Boolean);
          if (parts.length) rateMeta = `<div class="history-meta">${h.date || ''} · $1 = ${parts.join(' · ')}</div>`;
        }
        return `<div class="history-item" data-index="${i}"><span class="from">${h.from}</span>${exprNote}<span class="arrow">→</span>${h.to}${rateMeta}</div>`;
      }).join('');

      historyList.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => {
          const entry = history[parseInt(item.dataset.index)];
          if (!entry || !entry.sourceCurrency || !entry.sourceValue) return;
          if (!slots.includes(entry.sourceCurrency)) return;
          activate(entry.sourceCurrency);
          const inp = converterEl.querySelector(`.currency-input[data-currency="${entry.sourceCurrency}"]`);
          if (inp) {
            inp.value = entry.sourceValue;
            inp.dispatchEvent(new Event('input'));
          }
        });
      });
    }

    document.getElementById('clearHistory').addEventListener('click', () => {
      history = [];
      localStorage.setItem('fx_universal_history', '[]');
      renderHistory();
    });

    addBtn.addEventListener('click', addSlot);

    // --- Init ---
    initNumpad();
    if (numpadMode) mathHintEl.style.display = 'none';

    document.getElementById('switchToNumpadBtn').addEventListener('click', () => {
      numpadMode = true;
      localStorage.setItem('fx_numpad_mode', 'true');
      mathHintEl.style.display = 'none';
      const inp = converterEl.querySelector(`.currency-input[data-currency="${activeCurrency}"]`);
      if (inp) inp.blur();
      showNumpad();
    });
    renderConverter();
    renderRateChips();
    renderHistory();
    fetchRates();
  </script>
</body>
</html>
